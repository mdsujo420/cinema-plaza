<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Movie Plaza</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #070d1b;
            color: #f8fafc;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(7, 13, 27, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
        }
        .logo {
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.3px;
        }
        .search-bar input {
            padding: 6px 10px;
            width: 130px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 11px;
        }
        @media (min-width: 768px) {
            header { padding: 15px 5%; }
            .logo { font-size: 24px; }
            .search-bar input { width: 220px; font-size: 13px; }
        }

        .player-container {
            width: 94%;
            max-width: 1000px;
            margin: 15px auto;
        }
        @media (min-width: 768px) {
            .player-container { margin: 25px auto; }
        }

        /* Controls Section */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            background: #0b132b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-group label {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }
        .server-badge, select {
            background: #111827;
            border: 1px solid #374151;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
        }
        .server-badge {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #070d1b;
            border-color: #38bdf8;
        }
        select option { background: #111827; color: #fff; }

        /* Video Frame */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Media Info */
        .media-info {
            background: #0b132b;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .media-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
        @media (min-width: 768px) { .media-title { font-size: 24px; } }
        .media-meta {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .media-meta span { color: #38bdf8; }
        .media-desc {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .cast-section {
            margin-top: 12px;
            font-size: 11px;
            color: #94a3b8;
        }
        .cast-section b { color: #fff; }
        .loader { text-align: center; padding: 40px; color: #38bdf8; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <a href="index.html" class="logo">✨ Movie Plaza</a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search..." disabled>
        </div>
    </header>

    <div class="player-container">
        <!-- Controls: Fast Server, Season, Episode, Language -->
        <div class="controls-row">
            <div class="control-group">
                <label>Server:</label>
                <div class="server-badge">⚡ HD Server (100% Working)</div>
            </div>
            
            <div class="control-group" id="seasonGroup" style="display:none;">
                <label>Season:</label>
                <select id="seasonSelect" onchange="changeSeasonAndEpisodes()">
                    <option value="1">Season 1</option>
                </select>
            </div>

            <div class="control-group" id="episodeGroup" style="display:none;">
                <label>Episode:</label>
                <select id="episodeSelect" onchange="reloadPlayer()">
                    <option value="1">Ep 1</option>
                </select>
            </div>

            <div class="control-group" id="langGroup" style="display:none;">
                <label>Language:</label>
                <select id="langSelect" onchange="reloadPlayer()">
                    <option value="sub">Sub / Dub</option>
                    <option value="hindi">Hindi</option>
                    <option value="english">English</option>
                </select>
            </div>
        </div>

        <!-- Video Player Box -->
        <div class="video-wrapper" id="videoWrapper">
            <div class="loader" style="padding-top: 20%;">Loading player...</div>
        </div>

        <!-- Details & Description -->
        <div class="media-info" id="mediaInfo">
            <div class="loader">Loading details...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const type = urlParams.get('type') || 'movie';
        const category = urlParams.get('category') || 'movie';

        let mediaDetails = null;

        async function fetchDetails() {
            if(!id) {
                document.getElementById('videoWrapper').innerHTML = '<div class="loader">Media not found!</div>';
                return;
            }

            try {
                if(category === 'anime') {
                    const res = await fetch(`https://api.jikan.moe/v4/anime/${id}`);
                    const data = await res.json();
                    mediaDetails = data.data;
                    renderAnimeContent();
                } else {
                    const apiKey = '1a878c977c07619736ef416785671db8';
                    const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${apiKey}&append_to_response=credits`);
                    mediaDetails = await res.json();
                    renderTMDBContent();
                }
            } catch(e) {
                document.getElementById('videoWrapper').innerHTML = '<div class="loader">Failed to load stream.</div>';
            }
        }

        function renderTMDBContent() {
            const title = mediaDetails.title || mediaDetails.name;
            const year = (mediaDetails.release_date || mediaDetails.first_air_date || '2026').substring(0,4);
            const rating = mediaDetails.vote_average ? mediaDetails.vote_average.toFixed(1) : '7.5';
            const overview = mediaDetails.overview || 'No description available.';
            const cast = mediaDetails.credits?.cast ? mediaDetails.credits.cast.slice(0,4).map(c => c.name).join(', ') : 'N/A';

            // Check if it's a TV Series to show Season & Episode
            if(type === 'tv' && mediaDetails.seasons) {
                document.getElementById('seasonGroup').style.display = 'flex';
                document.getElementById('episodeGroup').style.display = 'flex';
                
                let sOptions = '';
                mediaDetails.seasons.forEach(s => {
                    if(s.season_number > 0) {
                        sOptions += `<option value="${s.season_number}" data-eps="${s.episode_count}">Season ${s.season_number} (${s.episode_count} Eps)</option>`;
                    }
                });
                document.getElementById('seasonSelect').innerHTML = sOptions;
                updateEpisodeList();
            }

            // Show Language selector only for titles that support multi-language options
            document.getElementById('langGroup').style.display = 'flex';

            reloadPlayer();

            document.getElementById('mediaInfo').innerHTML = `
                <div class="media-title">${title}</div>
                <div class="media-meta">
                    <span>⭐ ${rating}</span>
                    <span>📅 ${year}</span>
                    <span>🎬 ${type.toUpperCase()}</span>
                </div>
                <div class="media-desc">${overview}</div>
                <div class="cast-section"><b>Top Cast:</b> ${cast}</div>
            `;
        }

        function renderAnimeContent() {
            const title = mediaDetails.title_english || mediaDetails.title;
            const year = mediaDetails.year || '2026';
            const rating = mediaDetails.score ? mediaDetails.score.toFixed(1) : '8.0';
            const overview = mediaDetails.synopsis || 'No description available.';
            const episodesCount = mediaDetails.episodes || 12;

            // Anime Series Season/Episode management
            document.getElementById('seasonGroup').style.display = 'none'; // Anime usually handled by total episodes directly or single season view
            document.getElementById('episodeGroup').style.display = 'flex';
            document.getElementById('langGroup').style.display = 'flex';

            let epOptions = '';
            for(let i = 1; i <= episodesCount; i++) {
                epOptions += `<option value="${i}">Episode ${i}</option>`;
            }
            document.getElementById('episodeSelect').innerHTML = epOptions;

            reloadPlayer();

            document.getElementById('mediaInfo').innerHTML = `
                <div class="media-title">${title}</div>
                <div class="media-meta">
                    <span>⭐ ${rating}</span>
                    <span>📅 ${year}</span>
                    <span>⚡ ANIME (${episodesCount} Episodes)</span>
                </div>
                <div class="media-desc">${overview}</div>
            `;
        }

        function updateEpisodeList() {
            const seasonSelect = document.getElementById('seasonSelect');
            const selectedOption = seasonSelect.options[seasonSelect.selectedIndex];
            const epsCount = selectedOption.getAttribute('data-eps') || 12;

            let epOptions = '';
            for(let i = 1; i <= epsCount; i++) {
                epOptions += `<option value="${i}">Episode ${i}</option>`;
            }
            document.getElementById('episodeSelect').innerHTML = epOptions;
            reloadPlayer();
        }

        function changeSeasonAndEpisodes() {
            updateEpisodeList();
        }

        function reloadPlayer() {
            let embedUrl = '';
            const lang = document.getElementById('langSelect').value;

            if(category === 'anime') {
                const ep = document.getElementById('episodeSelect').value || 1;
                // Stable 100% working anime embed link with episode support
                embedUrl = `https://vidsrc.to/embed/anime/${id}/${ep}`;
            } else {
                if(type === 'tv') {
                    const season = document.getElementById('seasonSelect').value || 1;
                    const episode = document.getElementById('episodeSelect').value || 1;
                    embedUrl = `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
                } else {
                    embedUrl = `https://vidsrc.to/embed/movie/${id}`;
                }
            }

            document.getElementById('videoWrapper').innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
        }

        fetchDetails();
    </script>
</body>
</html>
