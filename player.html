<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Movie Plaza</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeypress="if(event.key === 'Enter') searchRedirect()">
        </div>
    </header>

    <div class="player-container">
        <div class="servers-bar">
            <span style="color: #94a3b8; font-weight: 600; font-size: 14px;">SERVER:</span>
            <button class="server-btn active" onclick="changeServer(1, this)">Server 1 (Fast)</button>
            <button class="server-btn" onclick="changeServer(2, this)">Server 2 (HD)</button>
            <button class="server-btn" onclick="changeServer(3, this)">Server 3 (Multi-Lang)</button>
        </div>

        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="details-card" id="detailsCard">
            <h2 id="movieTitle" style="color: #fff; font-size: 20px; margin-bottom: 5px;">Loading...</h2>
            <p id="movieGenres" style="color: #94a3b8; font-size: 14px; margin-bottom: 15px;"></p>
            <h3 style="color: #fff; font-size: 16px; margin-bottom: 10px;">Top Cast</h3>
            <div id="castList" style="color: #94a3b8; font-size: 14px;">Loading cast...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const type = urlParams.get('type') || 'movie';

        const iframe = document.getElementById('videoPlayer');

        function changeServer(serverNum, btn) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (serverNum === 1) {
                iframe.src = `https://vidsrc.xyz/embed/${type}?tmdb=${id}`;
            } else if (serverNum === 2) {
                iframe.src = `https://vidsrc.to/embed/${type}/${id}`;
            } else if (serverNum === 3) {
                iframe.src = `https://embed.su/embed/${type}/${id}`;
            }
        }

        // ডিফল্ট প্রথম সার্ভার লোড করা
        iframe.src = `https://vidsrc.xyz/embed/${type}?tmdb=${id}`;

        // মুভির বিস্তারিত তথ্য আনার জন্য API কল
        async function fetchDetails() {
            const TMDB_API_KEYS = [
                '1a878c977c07619736ef416785671db8',
                '9e303205ce05a268cb89dfaa06b3f1f0',
                'aab07fec041a520555467df59e5a4f64'
            ];
            const apiKey = TMDB_API_KEYS[0];

            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${apiKey}&append_to_response=credits`);
                const data = await res.json();

                if (data) {
                    document.getElementById('movieTitle').innerText = data.title || data.name || 'Unknown Title';
                    const genres = data.genres ? data.genres.map(g => g.name).join(', ') : '';
                    const year = (data.release_date || data.first_air_date || '').substring(0, 4);
                    document.getElementById('movieGenres').innerText = `${year} • ${genres}`;

                    if (data.credits && data.credits.cast) {
                        const castNames = data.credits.cast.slice(0, 5).map(c => c.name).join(', ');
                        document.getElementById('castList').innerText = castNames || 'No cast info available';
                    }
                }
            } catch (e) {
                console.log("Error loading details");
            }
        }

        function searchRedirect() {
            const q = document.getElementById('searchInput').value;
            if(q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        fetchDetails();
    </script>
</body>
</html>
