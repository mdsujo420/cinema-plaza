<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Watch Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #ecf0f1;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #00bfff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            background: #00bfff;
            border: none;
            color: #0a0e27;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #00a8d8;
            transform: scale(1.1);
        }

        .header-title {
            flex: 1;
            color: #00bfff;
            font-weight: bold;
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-box {
            background: #1a1f3a;
            padding: 8px 12px;
            border: 2px solid #00bfff;
            border-radius: 6px;
            color: #fff;
            width: 150px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Player */
        .player-section {
            background: #1a1f3a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.2);
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Controls */
        .controls-section {
            padding: 20px;
            background: #1a1f3a;
        }

        .control-row {
            margin-bottom: 15px;
        }

        .control-label {
            font-size: 12px;
            color: #7a8fa1;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .control-select {
            width: 100%;
            padding: 12px 15px;
            background: #0f1420;
            border: 2px solid #00bfff;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-select:hover {
            border-color: #00a8d8;
        }

        .control-select:focus {
            outline: none;
            border-color: #00a8d8;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        /* Details Section */
        .details-section {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .title-large {
            font-size: 28px;
            font-weight: bold;
            color: #00bfff;
            margin-bottom: 15px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: #0f1420;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #00bfff;
        }

        .meta-label {
            font-size: 11px;
            color: #7a8fa1;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .meta-value {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }

        .star {
            color: #ffd700;
        }

        .synopsis-box {
            background: #0f1420;
            padding: 15px;
            border-left: 3px solid #00bfff;
            border-radius: 8px;
            line-height: 1.6;
        }

        .synopsis-label {
            font-size: 12px;
            color: #7a8fa1;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .synopsis-text {
            color: #ecf0f1;
            font-size: 14px;
        }

        /* Related Content */
        .related-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 20px;
            color: #00bfff;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .related-card {
            background: #1a1f3a;
            border-radius: 12px;
            overflow: hidden;
