<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeyup="searchContent()">
        </div>
    </header>

    <div class="categories-bar">
        <div class="cat-pill active" onclick="switchTab('all', this)">🏠 All Content</div>
        <div class="cat-pill" onclick="switchTab('movie', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="switchTab('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="switchTab('trending', this)">🔥 Trending</div>
    </div>

    <div class="main-container">
        <div id="homeTopAd"></div>

        <div class="section-title" id="gridTitle1">🔥 Popular Movies</div>
        <div id="contentGrid" class="grid">Loading movies...</div>

        <div id="homeMiddleAd"></div>

        <div class="section-title" id="gridTitle2">⚡ Unlimited Anime Collection</div>
        <div id="contentGrid2" class="grid">Loading anime...</div>
    </div>

    <script>
        const TMDB_API_KEYS = [
            '1a878c977c07619736ef416785671db8',
            '9e303205ce05a268cb89dfaa06b3f1f0',
            'aab07fec041a520555467df59e5a4f64'
        ];

        function getActiveKey() {
            return TMDB_API_KEYS[Math.floor(Math.random() * TMDB_API_KEYS.length)];
        }

        let allMovies = [];
        let allAnime = [];

        function getSafeImage(url) {
            if (!url) return 'https://placehold.co/500x750/1e293b/ffffff?text=No+Poster';
            return `https://images.weserv.nl/?url=${encodeURIComponent(url)}`;
        }

        async function fetchMultiSourceContent() {
            try {
                const apiKey = getActiveKey();

                const fetchMovies = fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&page=1`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.results) {
                            return data.results.map(i => ({
                                id: 'm_' + i.id,
                                title: i.title || i.name,
                                type: 'movie',
                                poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                                rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                                year: (i.release_date || '2024').substring(0, 4),
                                lang: 'Hindi/Eng'
                            }));
                        }
                        return [];
                    }).catch(() => []);

                const fetchAnime = fetch(`https://api.jikan.moe/v4/top/anime?limit=25`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.data) {
                            return data.data.map(i => ({
                                id: 'a_' + i.mal_id,
                                title: i.title_english || i.title,
                                type: 'tv',
                                poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                                rating: i.score ? i.score.toFixed(1) : '8.0',
                                year: i.year || '2023',
                                lang: 'Sub/Dub',
                                isAnime: true
                            }));
                        }
                        return [];
                    }).catch(() => []);

                const [movies, anime] = await Promise.all([fetchMovies, fetchAnime]);

                allMovies = movies;
                allAnime = anime;

                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');

            } catch (err) {
                console.log("Error loading content");
            }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const realId = item.id.replace(/^[ma]_/, '');
                card.onclick = () => window.location.href = `player.html?id=${realId}&type=${item.type}`;
                
                const safeTitle = item.title ? item.title.replace(/'/g, "") : "Movie";
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${safeTitle}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/500x750/1e293b/ffffff?text=${encodeURIComponent(safeTitle)}'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            if (cat === 'all') {
                t1.innerText = '🔥 Popular Movies';
                t2.innerText = '⚡ Unlimited Anime Collection';
                t2.style.display = 'flex';
                g2.style.display = 'grid';
                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');
            } else if (cat === 'anime') {
                t1.innerText = '⚡ All Anime Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allAnime, 'contentGrid');
            } else if (cat === 'movie') {
                t1.innerText = '🎬 All Movies Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allMovies, 'contentGrid');
            } else if (cat === 'trending') {
                t1.innerText = '🔥 Trending Content';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid([...allMovies, ...allAnime], 'contentGrid');
            }
        }

        async function searchContent() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            if (!q) {
                switchTab('all', document.querySelector('.cat-pill.active'));
                return;
            }

            t1.innerText = `🔍 Search Results for: "${q}"`;
            t2.style.display = 'none';
            g2.style.display = 'none';

            try {
                const apiKey = getActiveKey();
                const tmdbSearch = fetch(`https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => null);
                const jikanSearch = fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=10`).then(r => r.json()).catch(() => null);

                const [tmdbRes, jikanRes] = await Promise.all([tmdbSearch, jikanSearch]);
                let results = [];

                if (tmdbRes && tmdbRes.results) {
                    tmdbRes.results.forEach(i => {
                        results.push({
                            id: 'm_' + i.id,
                            title: i.title || i.name,
                            type: i.media_type === 'tv' ? 'tv' : 'movie',
                            poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                            rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                            year: (i.release_date || i.first_air_date || '2024').substring(0, 4),
                            lang: 'Hindi/Eng'
                        });
                    });
                }

                if (jikanRes && jikanRes.data) {
                    jikanRes.data.forEach(i => {
                        results.push({
                            id: 'a_' + i.mal_id,
                            title: i.title_english || i.title,
                            type: 'tv',
                            poster: i.images?.jpg?.large_image_url || '',
                            rating: i.score ? i.score.toFixed(1) : '8.0',
                            year: i.year || '2023',
                            lang: 'Sub/Dub'
                        });
                    });
                }

                renderGrid(results, 'contentGrid');
            } catch (e) {
                console.error(e);
            }
        }

        fetchMultiSourceContent();
    </script>
</body>
</html>
