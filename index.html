<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #38bdf8;
            text-decoration: none;
        }
        .search-bar input {
            padding: 8px 14px;
            width: 220px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .search-bar input:focus {
            border-color: #38bdf8;
            width: 250px;
            transition: 0.3s;
        }
        /* ক্যাটাগরি ফিল্টার বার */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 5%;
            overflow-x: auto;
            background: #0b1120;
            border-bottom: 1px solid #1e293b;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-pill {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }
        .cat-pill.active, .cat-pill:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 5% 15px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }
        .view-all {
            color: #38bdf8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .view-all:hover {
            text-decoration: underline;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 0 5% 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .lang-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #38bdf8;
        }
        .card-content {
            padding: 10px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .card-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
        }
        .loader {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 14px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeypress="if(event.key === 'Enter') searchContent()">
        </div>
    </header>

    <!-- ক্যাটাগরি পেজ সিলেক্টর বার -->
    <div class="categories">
        <div class="cat-pill active" onclick="switchCategory('all', this)">🏠 হোম (সব)</div>
        <div class="cat-pill" onclick="switchCategory('movies', this)">🎬 পপুলার মুভিজ</div>
        <div class="cat-pill" onclick="switchCategory('anime', this)">⚡ টপ অ্যানিমে</div>
        <div class="cat-pill" onclick="switchCategory('onepiece', this)">🏴‍☠️ ওয়ান পিস স্পেশাল</div>
        <div class="cat-pill" onclick="switchCategory('action', this)">🔥 অ্যাকশন অ্যানিমে</div>
    </div>

    <!-- সেকশন ১ -->
    <div class="section-header">
        <div class="section-title" id="mainTitle1">🔥 পপুলার মুভি কালেকশন</div>
        <a class="view-all" onclick="switchCategory('movies', document.querySelectorAll('.cat-pill')[1])">সব দেখুন &rarr;</a>
    </div>
    <div class="grid" id="contentGrid1">
        <div class="loader">লোড হচ্ছে...</div>
    </div>

    <!-- সেকশন ২ -->
    <div class="section-header" id="headerSection2">
        <div class="section-title" id="mainTitle2">⚡ আনলিমিটেড অ্যানিমে কালেকশন</div>
        <a class="view-all" onclick="switchCategory('anime', document.querySelectorAll('.cat-pill')[2])">সব দেখুন &rarr;</a>
    </div>
    <div class="grid" id="contentGrid2">
        <div class="loader">লোড হচ্ছে...</div>
    </div>

    <script>
        let moviesData = [];
        let animeData = [];
        let onePieceData = [];
        let actionAnimeData = [];

        async function fetchAllCategories() {
            try {
                // ১. TMDB মুভিজ ফেচ করা (একাধিক পেজ থেকে প্রচুর মুভি)
                const moviePromises = [1, 2, 3].map(p => 
                    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=1a878c977c07619736ef416785671db8&page=${p}`)
                        .then(res => res.json())
                        .then(d => d.results || []).catch(() => [])
                );

                // ২. Jikan অ্যানিমে ফেচ করা (টপ অ্যানিমে পেজ ১, ২, ৩)
                const animePromises = [1, 2, 3].map(p => 
                    fetch(`https://api.jikan.moe/v4/top/anime?page=${p}`)
                        .then(res => res.json())
                        .then(d => d.data || []).catch(() => [])
                );

                // ৩. স্পেশাল: ওয়ান পিস (One Piece) সার্চ করে আলাদা ক্যাটাগরি তৈরি
                const onePiecePromise = fetch(`https://api.jikan.moe/v4/anime?q=One+Piece&limit=25`)
                    .then(res => res.json())
                    .then(d => d.data || []).catch(() => []);

                // ৪. অ্যাকশন অ্যানিমে ক্যাটাগরি
                const actionPromise = fetch(`https://api.jikan.moe/v4/anime?genres=1&limit=25`)
                    .then(res => res.json())
                    .then(d => d.data || []).catch(() => []);

                const [mPages, aPages, opList, actList] = await Promise.all([
                    Promise.all(moviePromises),
                    Promise.all(animePromises),
                    onePiecePromise,
                    actionPromise
                ]);

                moviesData = mPages.flat().map(i => ({
                    id: 'm_' + i.id,
                    title: i.title || i.name,
                    type: 'movie',
                    poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                    rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                    year: (i.release_date || '2024').substring(0, 4),
                    lang: 'Hindi/Eng',
                    isAnime: false
                }));

                animeData = aPages.flat().map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    type: 'tv',
                    poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    rating: i.score ? i.score.toFixed(1) : '8.0',
                    year: i.year || '2024',
                    lang: 'Sub/Dub',
                    isAnime: true
                }));

                onePieceData = opList.map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    type: 'tv',
                    poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    rating: i.score ? i.score.toFixed(1) : '8.5',
                    year: i.year || '1999',
                    lang: 'Sub/Dub',
                    isAnime: true
                }));

                actionAnimeData = actList.map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    type: 'tv',
                    poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    rating: i.score ? i.score.toFixed(1) : '8.2',
                    year: i.year || '2024',
                    lang: 'Sub/Dub',
                    isAnime: true
                }));

                // হোমপেজে বাই ডিফল্ট সব দেখাবে
                renderGrid(moviesData, 'contentGrid1');
                renderGrid(animeData, 'contentGrid2');

            } catch (e) {
                console.log("Error fetching data", e);
            }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<div class="loader">কোনো কন্টেন্ট পাওয়া যায়নি।</div>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const realId = item.id.replace(/^[ma]_/, '');
                
                card.onclick = () => {
                    if(item.isAnime) {
                        window.location.href = `player.html?id=${realId}&type=tv&isAnime=true`;
                    } else {
                        window.location.href = `player.html?id=${realId}&type=${item.type}&isAnime=false`;
                    }
                };
                
                const safeTitle = item.title ? item.title.replace(/'/g, "") : "Media";
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${safeTitle}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/500x750/1e293b/ffffff?text=${encodeURIComponent(safeTitle)}'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ক্যাটাগরি বা পেজ সুইচ করার ফাংশন
        function switchCategory(category, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const t1 = document.getElementById('mainTitle1');
            const g1 = document.getElementById('contentGrid1');
            const t2 = document.getElementById('mainTitle2');
            const g2 = document.getElementById('contentGrid2');
            const h2 = document.getElementById('headerSection2');

            if (category === 'all') {
                t1.innerText = '🔥 পপুলার মুভি কালেকশন';
                h2.style.display = 'flex';
                g2.style.display = 'grid';
                renderGrid(moviesData, 'contentGrid1');
                renderGrid(animeData, 'contentGrid2');
            } else if (category === 'movies') {
                t1.innerText = '🎬 সকল পপুলার মুভিজ';
                h2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(moviesData, 'contentGrid1');
            } else if (category === 'anime') {
                t1.innerText = '⚡ সকল টপ অ্যানিমে কালেকশন';
                h2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(animeData, 'contentGrid1');
            } else if (category === 'onepiece') {
                t1.innerText = '🏴‍☠️ ওয়ান পিস (One Piece) স্পেশাল কালেকশন';
                h2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(onePieceData, 'contentGrid1');
            } else if (category === 'action') {
                t1.innerText = '🔥 সেরা অ্যাকশন অ্যানিমে ক্যাটাগরি';
                h2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(actionAnimeData, 'contentGrid1');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            const allCombined = [...moviesData, ...animeData, ...onePieceData, ...actionAnimeData];
            const filtered = allCombined.filter(i => i.title.toLowerCase().includes(query));

            document.getElementById('mainTitle1').innerText = `🔍 "${query}" এর সার্চ ফলাফল`;
            document.getElementById('headerSection2').style.display = 'none';
            document.getElementById('contentGrid2').style.display = 'none';
            renderGrid(filtered, 'contentGrid1');
        }

        fetchAllCategories();
    </script>
</body>
</html>
