<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeyup="searchContent()">
        </div>
    </header>

    <div class="categories-bar">
        <div class="cat-pill active" onclick="switchTab('all', this)">🏠 All Content</div>
        <div class="cat-pill" onclick="switchTab('movie', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="switchTab('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="switchTab('trending', this)">🔥 Trending</div>
    </div>

    <div class="main-container">
        <div id="homeTopAd"></div>

        <div class="section-title" id="gridTitle1">🔥 Popular Movies</div>
        <div id="contentGrid" class="grid">Loading movies...</div>

        <div id="homeMiddleAd"></div>

        <div class="section-title" id="gridTitle2">⚡ Popular Anime</div>
        <div id="contentGrid2" class="grid">Loading anime...</div>
    </div>

    <script src="ads.js"></script>
    <script>
        const API_KEY = '15d2ea64021d46a192f0b70ed4b2cd35';

        // কাজ করে এমন সরাসরি সিডিএন ইমেজের ব্যাকআপ লিস্ট
        const backupMovies = [
            { id: 550, title: "Fight Club", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BMmEzNTkxYjQtZTc0MC00YTVjLTg5ZTEtZWMwOWVlYzY0NWIwXkEyXkFqcGdeQXVyNzkwMjQ5MDM@._V1_FMjpg_UX1000_.jpg", rating: "8.4", year: "1999", lang: "Hindi/Eng" },
            { id: 157336, title: "Interstellar", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", rating: "8.6", year: "2014", lang: "Hindi/Eng" },
            { id: 27205, title: "Inception", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", rating: "8.4", year: "2010", lang: "Hindi/Eng" },
            { id: 155, title: "The Dark Knight", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", rating: "8.5", year: "2008", lang: "Hindi/Eng" },
            { id: 299536, title: "Avengers: Infinity War", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BMjMxNjY2MDU1OV5BMl5BanBnXkFtZTgwNzY1MTUwNTM@._V1_.jpg", rating: "8.3", year: "2018", lang: "Hindi/Eng" },
            { id: 19995, title: "Avatar", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BZDA0OGM4NTItMDZkMC00M2VhLTg3N2EtOWFlODY3NDhhNzc3XkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", rating: "7.5", year: "2009", lang: "Hindi/Eng" },
            { id: 24428, title: "The Avengers", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BNDYxNjQyMjAtNTdiOS00NGYwLWEyMDAtNjk5ZTEyMDJmNDgxXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", rating: "7.7", year: "2012", lang: "Hindi/Eng" },
            { id: 603, title: "The Matrix", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BNzQzOTk3OTAtNDQ0Zi00ZTVkLWI0MTEtMDllZjNkYzNjNTc4XkEyXkFqcGdeQXVyNjU0OTQ0OTY@._V1_.jpg", rating: "8.2", year: "1999", lang: "Hindi/Eng" },
            { id: 671, title: "Harry Potter", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BNmQ0ODBhMjUtNDRhOC00MGQzLTlhMTYtVTg4MDA4MDg1M2JiXkEyXkFqcGdeQXVyNDYyMDkxOTA@._V1_.jpg", rating: "7.6", year: "2001", lang: "Hindi/Eng" },
            { id: 299534, title: "Avengers: Endgame", type: "movie", poster: "https://m.media-amazon.com/images/M/MV5BMTc5MDE2ODcwNV5BMl5BanBnXkFtZTgwMzI2NzQ2NzM@._V1_.jpg", rating: "8.4", year: "2019", lang: "Hindi/Eng" }
        ];

        const backupAnime = [
            { id: 37854, title: "One Piece", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BODcwNWE3OTMtMDc3MS00NDFjLWE1OTAtNDU3NjgxZmJhRXzAXkEyXkFqcGdeQXVyNjg2NjQwMDQ@._V1_.jpg", rating: "8.9", year: "1999", lang: "Sub/Dub", isAnime: true },
            { id: 1429, title: "Attack on Titan", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BNDYyNzM3OTEyOF5BMl5BanBnXkFtZTgwMDU5MDJhMjE@._V1_.jpg", rating: "9.0", year: "2013", lang: "Sub/Dub", isAnime: true },
            { id: 85937, title: "Demon Slayer", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BZjZjNzI5MDctY2Y4YS00NmM4LTgwOTItYzUks2M2N2VhYWIwXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_.jpg", rating: "8.7", year: "2019", lang: "Sub/Dub", isAnime: true },
            { id: 30984, title: "Bleach", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BZjE0YjVjODItMTViYS00YjNmLWE4NDAtZTBjY2QwNmE5NWJmXkEyXkFqcGdeQXVyNjAwNDUxODI@._V1_.jpg", rating: "8.3", year: "2004", lang: "Sub/Dub", isAnime: true },
            { id: 60572, title: "Dragon Ball Super", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BY2I2MzI1ODYtMWRlOS00M2JmLWFkNWItNWJiM2Y3ZWRkM2FiXkEyXkFqcGdeQXVyMjg1NDcxNDE@._V1_.jpg", rating: "8.1", year: "2015", lang: "Sub/Dub", isAnime: true },
            { id: 31911, title: "Fullmetal Alchemist", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BMTNmN2NmMWItM2E2MS00NjhjLThhNDItYjljNDJhMTU5MTM5XkEyXkFqcGdeQXVyNjAwNDUxODI@._V1_.jpg", rating: "8.7", year: "2009", lang: "Sub/Dub", isAnime: true },
            { id: 93405, title: "Jujutsu Kaisen", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BNGY4MTg3NjgtMmFkIN00NTg5LWE3MDItOWUxM2U3AGY3ZTMyXkEyXkFqcGdeQXVyMTI2MTc2MDA3._V1_.jpg", rating: "8.5", year: "2020", lang: "Sub/Dub", isAnime: true },
            { id: 46261, title: "Naruto Shippuden", type: "tv", poster: "https://m.media-amazon.com/images/M/MV5BZGFiMWFhNDAtMzUyS00MDgxLTlhNmEtMmI5YzA3MzA0ZmFiXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_.jpg", rating: "8.7", year: "2007", lang: "Sub/Dub", isAnime: true }
        ];

        let allMovies = [];
        let allAnime = [];

        // ছবি প্রক্সি ইউআরএল (TMDB ছবি ব্লক থাকলে বাইপাস করার জন্য)
        function getPosterUrl(path) {
            if (!path) return 'https://via.placeholder.com/500x750/1e293b/ffffff?text=No+Poster';
            if (path.startsWith('http')) return path;
            return `https://images.weserv.nl/?url=https://image.tmdb.org/t/p/w500${path}`;
        }

        async function fetchContent() {
            try {
                // একাধিক পেজ থেকে API ফেচ
                const [mRes1, mRes2, aRes1, aRes2] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=1`).catch(() => null),
                    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=2`).catch(() => null),
                    fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&with_original_language=ja&page=1`).catch(() => null),
                    fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&with_original_language=ja&page=2`).catch(() => null)
                ]);

                if (mRes1 && mRes1.ok) {
                    const d1 = await mRes1.json();
                    const d2 = mRes2 && mRes2.ok ? await mRes2.json() : { results: [] };
                    const combined = [...(d1.results || []), ...(d2.results || [])];
                    if (combined.length > 0) {
                        allMovies = combined.map(i => ({
                            id: i.id,
                            title: i.title || i.name,
                            type: 'movie',
                            poster: getPosterUrl(i.poster_path),
                            rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                            year: (i.release_date || '2024').substring(0, 4),
                            lang: 'Hindi/Eng'
                        }));
                    }
                }

                if (aRes1 && aRes1.ok) {
                    const d1 = await aRes1.json();
                    const d2 = aRes2 && aRes2.ok ? await aRes2.json() : { results: [] };
                    const combined = [...(d1.results || []), ...(d2.results || [])];
                    if (combined.length > 0) {
                        allAnime = combined.map(i => ({
                            id: i.id,
                            title: i.name || i.title,
                            type: 'tv',
                            poster: getPosterUrl(i.poster_path),
                            rating: i.vote_average ? i.vote_average.toFixed(1) : '8.0',
                            year: (i.first_air_date || '2024').substring(0, 4),
                            lang: 'Sub/Dub',
                            isAnime: true
                        }));
                    }
                }
            } catch (err) {
                console.log("Using backup dataset");
            }

            const finalMovies = allMovies.length > 0 ? allMovies : backupMovies;
            const finalAnime = allAnime.length > 0 ? allAnime : backupAnime;

            renderGrid(finalMovies, 'contentGrid');
            renderGrid(finalAnime, 'contentGrid2');
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `player.html?id=${item.id}&type=${item.type}`;
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750/1e293b/ffffff?text=${encodeURIComponent(item.title)}'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            const currentMovies = allMovies.length > 0 ? allMovies : backupMovies;
            const currentAnime = allAnime.length > 0 ? allAnime : backupAnime;

            if (cat === 'all') {
                t1.innerText = '🔥 Popular Movies';
                t2.innerText = '⚡ Popular Anime';
                t2.style.display = 'flex';
                g2.style.display = 'grid';
                renderGrid(currentMovies, 'contentGrid');
                renderGrid(currentAnime, 'contentGrid2');
            } else if (cat === 'anime') {
                t1.innerText = '⚡ All Anime Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(currentAnime, 'contentGrid');
            } else if (cat === 'movie') {
                t1.innerText = '🎬 All Movies Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(currentMovies, 'contentGrid');
            } else if (cat === 'trending') {
                t1.innerText = '🔥 Trending Content';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid([...currentMovies, ...currentAnime], 'contentGrid');
            }
        }

        async function searchContent() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            const currentMovies = allMovies.length > 0 ? allMovies : backupMovies;
            const currentAnime = allAnime.length > 0 ? allAnime : backupAnime;

            if (!q) {
                switchTab('all', document.querySelector('.cat-pill.active'));
                return;
            }

            t1.innerText = `🔍 Search Results for: "${q}"`;
            t2.style.display = 'none';
            g2.style.display = 'none';

            const filtered = [...currentMovies, ...currentAnime].filter(i => i.title.toLowerCase().includes(q));
            renderGrid(filtered, 'contentGrid');
        }

        if (typeof renderAdBanner === 'function') {
            renderAdBanner('homeTopAd');
            renderAdBanner('homeMiddleAd');
        }

        fetchContent();
    </script>
</body>
</html>
