<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeyup="searchContent()">
        </div>
    </header>

    <div class="categories-bar">
        <div class="cat-pill active" onclick="switchTab('all', this)">🏠 All Content</div>
        <div class="cat-pill" onclick="switchTab('movie', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="switchTab('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="switchTab('trending', this)">🔥 Trending</div>
    </div>

    <div class="main-container">
        <div id="homeTopAd"></div>

        <div class="section-title" id="gridTitle1">🔥 Unlimited Movies</div>
        <div id="contentGrid" class="grid">Loading unlimited movies...</div>

        <div id="homeMiddleAd"></div>

        <div class="section-title" id="gridTitle2">⚡ Unlimited Anime</div>
        <div id="contentGrid2" class="grid">Loading unlimited anime...</div>
    </div>

    <script src="ads.js"></script>
    <script>
        const API_KEY = '15d2ea64021d46a192f0b70ed4b2cd35';

        let allMovies = [];
        let allAnime = [];

        // একাধিক পেজ থেকে একসাথে প্রচুর ডেটা ফ্যাচ করার ফাংশন
        async function fetchUnlimitedData() {
            try {
                // ১ম থেকে ৫ম পেজের মুভি এবং এনিমে কল (একসাথে ১০০+ করে ডেটা আসবে)
                const moviePages = [1, 2, 3, 4, 5];
                const animePages = [1, 2, 3, 4, 5];

                const movieRequests = moviePages.map(page => 
                    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=${page}`).then(res => res.json())
                );

                const animeRequests = animePages.map(page => 
                    fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&with_original_language=ja&sort_by=popularity.desc&page=${page}`).then(res => res.json())
                );

                const moviesResults = await Promise.all(movieRequests);
                const animeResults = await Promise.all(animeRequests);

                // মুভি ডেটা প্রসেস
                moviesResults.forEach(data => {
                    if (data.results) {
                        const formatted = data.results.map(i => ({
                            id: i.id,
                            title: i.title || i.name,
                            type: 'movie',
                            poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : 'https://via.placeholder.com/500x750/1e293b/ffffff?text=No+Poster',
                            rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                            year: (i.release_date || '2024').substring(0, 4),
                            lang: 'Hindi/Eng'
                        }));
                        allMovies.push(...formatted);
                    }
                });

                // এনিমে ডেটা প্রসেস
                animeResults.forEach(data => {
                    if (data.results) {
                        const formatted = data.results.map(i => ({
                            id: i.id,
                            title: i.name || i.title,
                            type: 'tv',
                            poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : 'https://via.placeholder.com/500x750/1e293b/ffffff?text=No+Poster',
                            rating: i.vote_average ? i.vote_average.toFixed(1) : '8.0',
                            year: (i.first_air_date || '2024').substring(0, 4),
                            lang: 'Sub/Dub',
                            isAnime: true
                        }));
                        allAnime.push(...formatted);
                    }
                });

                // ইউনিক কন্টেন্ট ফিল্টার
                allMovies = Array.from(new Map(allMovies.map(item => [item.id, item])).values());
                allAnime = Array.from(new Map(allAnime.map(item => [item.id, item])).values());

                // স্ক্রিনে রেন্ডার
                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');

            } catch (err) {
                console.error("Data fetch error:", err);
            }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `player.html?id=${item.id}&type=${item.type}`;
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750/1e293b/ffffff?text=Movie+Plaza'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            if (cat === 'all') {
                t1.innerText = '🔥 Unlimited Movies';
                t2.innerText = '⚡ Unlimited Anime';
                t2.style.display = 'flex';
                g2.style.display = 'grid';
                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');
            } else if (cat === 'anime') {
                t1.innerText = '⚡ All Anime Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allAnime, 'contentGrid');
            } else if (cat === 'movie') {
                t1.innerText = '🎬 All Movies Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allMovies, 'contentGrid');
            } else if (cat === 'trending') {
                t1.innerText = '🔥 Trending Movies & Anime';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid([...allMovies, ...allAnime], 'contentGrid');
            }
        }

        async function searchContent() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            if (!q) {
                switchTab('all', document.querySelector('.cat-pill.active'));
                return;
            }

            t1.innerText = `🔍 Search Results for: "${q}"`;
            t2.style.display = 'none';
            g2.style.display = 'none';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (data.results) {
                    const searchResults = data.results.map(i => ({
                        id: i.id,
                        title: i.title || i.name,
                        type: i.media_type === 'tv' ? 'tv' : 'movie',
                        poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : 'https://via.placeholder.com/500x750/1e293b/ffffff?text=No+Poster',
                        rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                        year: (i.release_date || i.first_air_date || '2024').substring(0, 4),
                        lang: i.original_language === 'ja' ? 'Sub/Dub' : 'Hindi/Eng'
                    }));
                    renderGrid(searchResults, 'contentGrid');
                }
            } catch (e) {
                console.error(e);
            }
        }

        if (typeof renderAdBanner === 'function') {
            renderAdBanner('homeTopAd');
            renderAdBanner('homeMiddleAd');
        }

        fetchUnlimitedData();
    </script>
</body>
</html>
