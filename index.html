<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Plaza - Premium Streaming</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 2.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        p { color: #94a3b8; font-size: 0.95rem; }
        
        .filters { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s ease; }
        button:hover, button.active { background: #38bdf8; color: #090d16; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: all 0.25s ease; cursor: pointer; }
        .card:hover { transform: translateY(-6px); border-color: #38bdf8; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-content { padding: 12px; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info { font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.7rem; }
        .loader { text-align: center; font-size: 1.2rem; color: #38bdf8; margin-top: 60px; }

        /* Premium Custom Modal Player */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { position: relative; width: 95%; max-width: 960px; background: #0f172a; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.2); overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        .close-btn { position: absolute; top: 12px; right: 16px; color: #94a3b8; font-size: 26px; font-weight: bold; cursor: pointer; z-index: 1001; transition: color 0.2s; }
        .close-btn:hover { color: #f43f5e; }
        
        /* Modern Glassmorphic Controls Bar */
        .controls-bar { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 10px; padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
        .controls-bar select { background: #0f172a; color: #f8fafc; border: 1px solid #38bdf8; padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; outline: none; cursor: pointer; transition: 0.2s; }
        .controls-bar select:hover { background: #1e293b; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Cinema Plaza</h1>
        <p>Automated Movies & Anime Hub</p>
    </header>

    <div class="filters">
        <button class="active" onclick="filterContent('all')">All</button>
        <button onclick="filterContent('movie')">Movies</button>
        <button onclick="filterContent('anime')">Anime</button>
    </div>

    <div id="loader" class="loader">Loading content...</div>
    <div id="content-grid" class="grid"></div>

    <!-- Video Modal Player -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            
            <div class="controls-bar" id="controlsBar">
                <!-- Server Selector -->
                <select id="serverSelect" onchange="updateStreamUrl()">
                    <option value="vidlink">Server 1 (Multi-Audio & Subtitles)</option>
                    <option value="autoembed">Server 2 (AutoEmbed Pro)</option>
                </select>

                <!-- Dynamic Season Selector -->
                <select id="seasonSelect" onchange="onSeasonChange()" style="display: none;">
                    <option value="">Loading Seasons...</option>
                </select>

                <!-- Dynamic Episode Selector -->
                <select id="episodeSelect" onchange="updateStreamUrl()" style="display: none;">
                    <option value="">Loading Episodes...</option>
                </select>
            </div>

            <div class="iframe-container">
                <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        window.open = function() { return null; }; // Popup Blocker

        const API_URL = 'https://cinema-plaza.onrender.com/api/content';
        const TMDB_API_KEY = '15d2ea64021d46a192f0b70ed4b2cd35'; // TMDB API for fetching exact Seasons & Episodes
        let allData = [];
        let currentItem = null;

        async function loadContent() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if(data.success) {
                    allData = data.data;
                    document.getElementById('loader').style.display = 'none';
                    renderCards(allData);
                }
            } catch (error) {
                document.getElementById('loader').innerText = 'Failed to load content. Please refresh.';
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(item);
                card.innerHTML = `
                    <img src="${item.poster || 'https://via.placeholder.com/500x750?text=No+Poster'}" alt="${item.title}">
                    <div class="card-content">
                        <div class="card-title" title="${item.title}">${item.title}</div>
                        <div class="card-info">
                            <span class="badge">${item.type}</span>
                            <span>⭐ ${item.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterContent(type) {
            document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if(type === 'all') renderCards(allData);
            else renderCards(allData.filter(i => i.type === type));
        }

        async function openPlayer(item) {
            currentItem = item;
            const playerModal = document.getElementById('videoModal');
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');

            if(item.type === 'anime' || item.type === 'tv') {
                seasonSelect.style.display = 'inline-block';
                episodeSelect.style.display = 'inline-block';
                
                // Fetch Exact TMDB Details dynamically
                await fetchTvDetails(item.id);
            } else {
                seasonSelect.style.display = 'none';
                episodeSelect.style.display = 'none';
                updateStreamUrl();
            }

            playerModal.style.display = 'flex';
        }

        async function fetchTvDetails(tvId) {
            const seasonSelect = document.getElementById('seasonSelect');
            seasonSelect.innerHTML = '<option>Loading...</option>';
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                
                seasonSelect.innerHTML = '';
                if(data.seasons && data.seasons.length > 0) {
                    data.seasons.forEach(season => {
                        // Exclude Specials (Season 0) if needed, or keep valid seasons
                        if(season.season_number > 0) {
                            seasonSelect.innerHTML += `<option value="${season.season_number}" data-episodes="${season.episode_count}">Season ${season.season_number}</option>`;
                        }
                    });
                } else {
                    seasonSelect.innerHTML = `<option value="1" data-episodes="12">Season 1</option>`;
                }

                onSeasonChange();
            } catch(e) {
                // Fallback if API fails
                seasonSelect.innerHTML = `<option value="1" data-episodes="24">Season 1</option>`;
                populateEpisodes(24);
                updateStreamUrl();
            }
        }

        function onSeasonChange() {
            const seasonSelect = document.getElementById('seasonSelect');
            const selectedOption = seasonSelect.options[seasonSelect.selectedIndex];
            const episodeCount = selectedOption ? selectedOption.getAttribute('data-episodes') || 12 : 12;
            
            populateEpisodes(parseInt(episodeCount));
            updateStreamUrl();
        }

        function populateEpisodes(count) {
            const episodeSelect = document.getElementById('episodeSelect');
            episodeSelect.innerHTML = '';
            for(let e = 1; e <= count; e++) {
                episodeSelect.innerHTML += `<option value="${e}">Episode ${e}</option>`;
            }
        }

        function updateStreamUrl() {
            const iframe = document.getElementById('videoPlayer');
            const server = document.getElementById('serverSelect').value;
            const id = currentItem.id;

            if(currentItem.type === 'movie') {
                if(server === 'vidlink') {
                    iframe.src = `https://vidlink.pro/movie/${id}?multi=true`;
                } else {
                    iframe.src = `https://player.autoembed.cc/embed/movie/${id}`;
                }
            } else {
                const season = document.getElementById('seasonSelect').value || 1;
                const episode = document.getElementById('episodeSelect').value || 1;

                if(server === 'vidlink') {
                    iframe.src = `https://vidlink.pro/tv/${id}/${season}/${episode}?multi=true`;
                } else {
                    iframe.src = `https://player.autoembed.cc/embed/tv/${id}/${season}/${episode}`;
                }
            }
        }

        function closePlayer() {
            const playerModal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = ''; 
            playerModal.style.display = 'none';
        }

        loadContent();
    </script>
</body>
</html>
