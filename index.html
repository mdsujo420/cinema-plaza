<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 23, 42, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            text-decoration: none;
        }
        .search-bar input {
            padding: 10px 15px;
            width: 250px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 20px 5%;
            overflow-x: auto;
        }
        .cat-pill {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .cat-pill.active, .cat-pill:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: 600;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 20px 5% 15px;
            color: #f8fafc;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 0 5% 40px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .lang-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #38bdf8;
        }
        .card-content {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }
        .card-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeypress="if(event.key === 'Enter') searchRedirect()">
        </div>
    </header>

    <div class="categories">
        <div class="cat-pill active" onclick="switchTab('all', this)">🔥 All Popular</div>
        <div class="cat-pill" onclick="switchTab('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="switchTab('movie', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="switchTab('trending', this)">✨ Trending</div>
    </div>

    <div class="section-title" id="gridTitle1">🔥 Popular Movies</div>
    <div class="grid" id="contentGrid"></div>

    <div class="section-title" id="gridTitle2">⚡ Unlimited Anime Collection</div>
    <div class="grid" id="contentGrid2"></div>

    <script>
        let allMovies = [];
        let allAnime = [];

        async function fetchMultiSourceContent() {
            try {
                // ১. Jikan API থেকে একাধিক পেজ থেকে প্রচুর অ্যানিমে ডাটা আনা (কোনো এপিআই কি প্রয়োজন নেই)
                const animePromises = [1, 2, 3].map(page => 
                    fetch(`https://api.jikan.moe/v4/top/anime?page=${page}`)
                        .then(res => res.json())
                        .then(data => data.data || [])
                        .catch(() => [])
                );

                // ২. TMDB থেকে মুভির ডাটা ফেচ করা
                const moviePromises = [1, 2].map(page => 
                    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=1a878c977c07619736ef416785671db8&page=${page}`)
                        .then(res => res.json())
                        .then(data => data.results || [])
                        .catch(() => [])
                );

                const [animePages, moviePages] = await Promise.all([
                    Promise.all(animePromises),
                    Promise.all(moviePromises)
                ]);

                const rawAnime = animePages.flat();
                const rawMovies = moviePages.flat();

                allAnime = rawAnime.map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    type: 'tv',
                    poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    rating: i.score ? i.score.toFixed(1) : '8.0',
                    year: i.year || '2024',
                    lang: 'Sub/Dub',
                    isAnime: true
                }));

                allMovies = rawMovies.map(i => ({
                    id: 'm_' + i.id,
                    title: i.title || i.name,
                    type: 'movie',
                    poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                    rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                    year: (i.release_date || '2024').substring(0, 4),
                    lang: 'Hindi/Eng',
                    isAnime: false
                }));

                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');

            } catch (err) {
                console.log("Error loading content securely", err);
            }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const realId = item.id.replace(/^[ma]_/, '');
                
                if(item.isAnime) {
                    card.onclick = () => window.location.href = `player.html?id=${realId}&type=tv&isAnime=true`;
                } else {
                    card.onclick = () => window.location.href = `player.html?id=${realId}&type=${item.type}&isAnime=false`;
                }
                
                const safeTitle = item.title ? item.title.replace(/'/g, "") : "Media";
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${safeTitle}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/500x750/1e293b/ffffff?text=${encodeURIComponent(safeTitle)}'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const t1 = document.getElementById('gridTitle1');
            const t2 = document.getElementById('gridTitle2');
            const g2 = document.getElementById('contentGrid2');

            if (cat === 'all') {
                t1.innerText = '🔥 Popular Movies';
                t2.innerText = '⚡ Unlimited Anime Collection';
                t2.style.display = 'flex';
                g2.style.display = 'grid';
                renderGrid(allMovies, 'contentGrid');
                renderGrid(allAnime, 'contentGrid2');
            } else if (cat === 'anime') {
                t1.innerText = '⚡ All Anime Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allAnime, 'contentGrid');
            } else if (cat === 'movie') {
                t1.innerText = '🎬 All Movies Collection';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid(allMovies, 'contentGrid');
            } else if (cat === 'trending') {
                t1.innerText = '🔥 Trending Content';
                t2.style.display = 'none';
                g2.style.display = 'none';
                renderGrid([...allMovies, ...allAnime], 'contentGrid');
            }
        }

        function searchRedirect() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) return;
            
            const filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(query));
            const filteredAnime = allAnime.filter(a => a.title.toLowerCase().includes(query));

            document.getElementById('gridTitle1').innerText = `Search Results for "${query}"`;
            document.getElementById('gridTitle2').style.display = 'none';
            document.getElementById('contentGrid2').style.display = 'none';
            renderGrid([...filteredMovies, ...filteredAnime], 'contentGrid');
        }

        fetchMultiSourceContent();
    </script>
</body>
</html>
