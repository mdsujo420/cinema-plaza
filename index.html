<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movebox Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🍿 Movebox</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / TV Shows / Anime..." onkeyup="searchContent()">
        </div>
    </header>

    <div class="categories-bar">
        <div class="cat-pill active" onclick="filterCat('all', this)">🏠 Home</div>
        <div class="cat-pill" onclick="filterCat('tv', this)">📺 TV Shows</div>
        <div class="cat-pill" onclick="filterCat('movie', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="filterCat('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="filterCat('trending', this)">🔥 Trending</div>
    </div>

    <div class="main-container">
        <!-- Top Banner Ad (Header/Hero Below Slot) -->
        <div id="homeTopAd"></div>

        <div class="section-title">🔥 Trending Now</div>
        <div id="contentGrid" class="grid"></div>

        <!-- In-Between Grid Banner Ads (Movebox Native Style) -->
        <div id="homeMiddleAd" class="ad-grid-row"></div>

        <div class="section-title">📺 Popular Content</div>
        <div id="contentGrid2" class="grid"></div>
    </div>

    <script src="ads.js"></script>
    <script>
        const TMDB_API_KEY = '15d2ea64021d46a192f0b70ed4b2cd35';
        let allItems = [];

        async function loadContent() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if(data.results) {
                    allItems = data.results.map(i => ({
                        id: i.id,
                        title: i.title || i.name,
                        type: i.media_type === 'movie' ? 'movie' : 'tv',
                        poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                        rating: i.vote_average ? i.vote_average.toFixed(1) : '8.0',
                        year: (i.release_date || i.first_air_date || '2024').substring(0, 4),
                        lang: i.original_language === 'ja' ? 'Sub/Dub' : 'Hindi/Eng'
                    }));

                    renderGrid(allItems.slice(0, 10), 'contentGrid');
                    renderGrid(allItems.slice(10, 20), 'contentGrid2');
                }
            } catch(e) { console.error(e); }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if(!grid) return;
            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    window.location.href = `player.html?id=${item.id}&type=${item.type}`;
                };
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster || 'https://via.placeholder.com/500x750'}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(cat === 'all' || cat === 'trending') {
                renderGrid(allItems.slice(0, 10), 'contentGrid');
                renderGrid(allItems.slice(10, 20), 'contentGrid2');
            } else {
                const filtered = allItems.filter(i => cat === 'anime' ? (i.lang === 'Sub/Dub' || i.type === 'tv') : i.type === cat);
                renderGrid(filtered, 'contentGrid');
                document.getElementById('contentGrid2').innerHTML = '';
            }
        }

        function searchContent() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allItems.filter(i => i.title.toLowerCase().includes(q));
            renderGrid(filtered, 'contentGrid');
            document.getElementById('contentGrid2').innerHTML = '';
        }

        // Render Ads on Home
        renderAdBanner('homeTopAd', 'leaderboard');
        renderAdBanner('homeMiddleAd', 'banner');
        loadContent();
    </script>
</body>
</html>
