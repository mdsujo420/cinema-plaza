<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="monetag" content="05675a920955aeff51babffe2dc93773">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Ultimate Streaming Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #070d1b; color: #f8fafc; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(7, 13, 27, 0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #1e293b; backdrop-filter: blur(10px); }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .menu-toggle { background: none; border: none; color: #38bdf8; font-size: 20px; cursor: pointer; }
        .logo { font-size: 15px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #38ef7d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .search-bar input { padding: 6px 10px; width: 130px; background: #111827; border: 1px solid #374151; border-radius: 6px; color: #fff; outline: none; font-size: 11px; transition: 0.3s; }
        .search-bar input:focus { border-color: #38bdf8; width: 170px; }
        @media (min-width: 768px) { header { padding: 15px 5%; } .logo { font-size: 24px; } .search-bar input { width: 220px; font-size: 13px; } }

        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: #0b132b; border-right: 1px solid #1e293b; z-index: 2000; transition: 0.35s; padding: 25px; box-shadow: 5px 0 25px rgba(0,0,0,0.5); }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .sidebar-logo { font-size: 20px; font-weight: 800; color: #38bdf8; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { padding: 12px 16px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; color: #cbd5e1; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; background: #111827; border: 1px solid #1f2937; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; display: none; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }

        .categories { display: flex; gap: 10px; padding: 12px 4%; background: #090e1a; border-bottom: 1px solid #1e293b; overflow-x: auto; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-pill { background: #111827; border: 1px solid #374151; color: #cbd5e1; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .cat-pill.active { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #070d1b; border-color: #38bdf8; }

        .hero-slider { position: relative; width: 92%; height: 220px; margin: 15px auto; border-radius: 14px; overflow: hidden; background: #111827; border: 1px solid #374151; }
        @media (min-width: 768px) { .hero-slider { width: 90%; height: 380px; margin: 20px auto; } }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
        .slide-content { position: absolute; bottom: 15px; left: 15px; right: 15px; z-index: 2; }
        .slide-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .slide-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: #fff; }
        .slide-desc { font-size: 11px; color: #cbd5e1; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .watch-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #070d1b; border: none; padding: 6px 14px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 11px; }

        .home-ad-slot { width: 92%; max-width: 1000px; margin: 15px auto; text-align: center; background: #0b132b; border: 1px dashed #1e293b; border-radius: 8px; padding: 8px; overflow: hidden; }
        
        .section-header { margin: 20px 4% 10px; }
        .section-title { font-size: 15px; font-weight: 700; color: #f8fafc; border-left: 4px solid #38bdf8; padding-left: 8px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 4% 40px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; padding: 0 5% 40px; } }
        .card { background: #111827; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid #1f2937; }
        .card img { width: 100%; height: 140px; object-fit: cover; display: block; }
        @media (min-width: 768px) { .card img { height: 240px; } }
        .lang-badge { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 3px; border: 1px solid #38bdf8; }
        .card-content { padding: 8px; }
        .card-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .card-info { display: flex; justify-content: space-between; font-size: 9px; color: #94a3b8; }
        .loader { text-align: center; padding: 40px; color: #38bdf8; font-size: 14px; grid-column: 1 / -1; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: #0b132b; border: 1px solid #374151; padding: 25px; border-radius: 14px; z-index: 3000; width: 90%; max-width: 400px; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .modal h3 { margin-bottom: 10px; color: #38bdf8; font-size: 18px; }
        .modal p { color: #cbd5e1; font-size: 12px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .modal input { width: 100%; padding: 9px 12px; background: #111827; border: 1px solid #374151; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .modal-btn { background: #38bdf8; color: #070d1b; border: none; padding: 10px; font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px; }
        .close-modal-x { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🎬 Movie Plaza</div>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="switchCategory('home'); toggleSidebar();">🏠 Home Dashboard</li>
            <li onclick="switchCategory('movies'); toggleSidebar();">🎬 Trending Movies</li>
            <li onclick="switchCategory('anime'); toggleSidebar();">⚡ Top Trending Anime</li>
            <li onclick="switchCategory('kdrama'); toggleSidebar();">🇰🇷 Trending K-Dramas</li>
            <li onclick="openAuthModal('signin');">👤 Sign In / Sign Up</li>
            <li onclick="openFavoritesModal();">⭐ My Favorites</li>
            <li onclick="openSettingsModal();">⚙️ Settings</li>
        </ul>
    </div>

    <div class="overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="modal" id="activeModal">
        <button class="close-modal-x" onclick="closeModal()">✕</button>
        <div id="modalBodyContent"></div>
    </div>

    <header>
        <div class="header-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <a href="index.html" class="logo">✨ Movie Plaza</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search..." onkeypress="if(event.key === 'Enter') searchContent()">
        </div>
    </header>

    <div class="categories">
        <div class="cat-pill active" onclick="switchCategory('home', this)">🏠 Home</div>
        <div class="cat-pill" onclick="switchCategory('movies', this)">🎬 Movies</div>
        <div class="cat-pill" onclick="switchCategory('anime', this)">⚡ Anime</div>
        <div class="cat-pill" onclick="switchCategory('kdrama', this)">🇰🇷 K-Dramas</div>
    </div>

    <div class="hero-slider" id="heroSlider">
        <div class="loader" style="padding-top: 80px;">Loading banner...</div>
    </div>

    <div class="home-ad-slot">
        <div id="home-top-banner"></div>
    </div>

    <div class="section-header">
        <div class="section-title" id="mainTitle1">🔥 Trending Feed & Popular Collections</div>
    </div>
    <div class="grid" id="contentGrid1">
        <div class="loader">Loading catalog...</div>
    </div>

    <div class="home-ad-slot">
        <div id="home-bottom-banner"></div>
    </div>

    <script src="ads.js"></script>
    <script>
        // Render Banners after ads.js loads
        window.addEventListener('DOMContentLoaded', () => {
            renderAdBanner('home-top-banner', 'banner728');
            renderAdBanner('home-bottom-banner', 'native');
        });

        let moviesData = [], animeData = [], kdramaData = [], sliderItems = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function closeModal() {
            document.getElementById('activeModal').classList.remove('active');
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function openModalHTML(htmlContent) {
            toggleSidebar();
            document.getElementById('modalBodyContent').innerHTML = htmlContent;
            document.getElementById('activeModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function openAuthModal(mode = 'signin') {
            const isUserLoggedIn = localStorage.getItem('mp_user');
            if(isUserLoggedIn) {
                openModalHTML(`<h3>👤 Profile</h3><p>Logged in as <b>${isUserLoggedIn}</b>.</p><button class="modal-btn" onclick="logoutUser()" style="background:#ef4444; color:#fff;">Sign Out</button>`);
                return;
            }
            if(mode === 'signin') {
                openModalHTML(`<h3>Sign In</h3><div class="form-group"><label>Email</label><input type="email" id="authEmail" placeholder="email@example.com"></div><div class="form-group"><label>Password</label><input type="password" id="authPass" placeholder="••••••••"></div><button class="modal-btn" onclick="handleLogin()">Sign In</button>`);
            } else {
                openModalHTML(`<h3>Sign Up</h3><div class="form-group"><label>Name</label><input type="text" id="regName" placeholder="Sujon"></div><div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@example.com"></div><div class="form-group"><label>Password</label><input type="password" id="regPass" placeholder="••••••••"></div><button class="modal-btn" onclick="handleRegister()">Sign Up</button>`);
            }
        }

        function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            if(!email) { alert('Enter email'); return; }
            localStorage.setItem('mp_user', email);
            alert('Signed in!'); closeModal();
        }

        function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            if(!email) { alert('Enter details'); return; }
            localStorage.setItem('mp_user', email);
            alert('Registered & Logged in!'); closeModal();
        }

        function logoutUser() {
            localStorage.removeItem('mp_user');
            alert('Signed out.'); closeModal();
        }

        function openFavoritesModal() { openModalHTML(`<h3>⭐ My Favorites</h3><p>Your saved bookmarks will appear here.</p>`); }
        function openSettingsModal() { 
            openModalHTML(`<h3>⚙️ Settings</h3>
                <div class="form-group">
                    <label>Streaming Quality</label>
                    <select style="width:100%; padding:8px; background:#111827; border:1px solid #374151; color:#fff; border-radius:6px;">
                        <option>1080p Full HD</option>
                        <option>720p HD</option>
                        <option>480p SD</option>
                    </select>
                </div>
                <button class="modal-btn" onclick="closeModal()">Save Settings</button>`); 
        }

        async function fetchAllData() {
            try {
                const moviePromises = [], kdramaPromises = [];
                for(let p = 1; p <= 10; p++) {
                    moviePromises.push(fetch(`https://api.themoviedb.org/3/movie/popular?api_key=1a878c977c07619736ef416785671db8&page=${p}`).then(res => res.json()).then(d => d.results || []).catch(() => []));
                    kdramaPromises.push(fetch(`https://api.themoviedb.org/3/discover/tv?api_key=1a878c977c07619736ef416785671db8&with_original_language=ko&sort_by=popularity.desc&page=${p}`).then(res => res.json()).then(d => d.results || []).catch(() => []));
                }
                const animePromises = [];
                for(let p = 1; p <= 8; p++) {
                    animePromises.push(fetch(`https://api.jikan.moe/v4/top/anime?page=${p}`).then(res => res.json()).then(d => d.data || []).catch(() => []));
                }
                const [mPages, kPages, aPages] = await Promise.all([Promise.all(moviePromises), Promise.all(kdramaPromises), Promise.all(animePromises)]);

                moviesData = Array.from(new Map(mPages.flat().map(i => [i.id, { id: 'm_' + i.id, realId: i.id, title: i.title || i.name, type: 'movie', poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '', backdrop: i.backdrop_path ? `https://image.tmdb.org/t/p/w1280${i.backdrop_path}` : '', rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5', year: (i.release_date || '2026').substring(0, 4), overview: i.overview || '', lang: 'Hindi/Eng', category: 'movie' }])).values());
                
                kdramaData = Array.from(new Map(kPages.flat().map(i => [i.id, { id: 'k_' + i.id, realId: i.id, title: i.name || i.title, type: 'tv', poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '', backdrop: i.backdrop_path ? `https://image.tmdb.org/t/p/w1280${i.backdrop_path}` : '', rating: i.vote_average ? i.vote_average.toFixed(1) : '8.2', year: (i.first_air_date || '2026').substring(0, 4), overview: i.overview || '', lang: 'Korean/Sub', category: 'kdrama' }])).values());

                animeData = Array.from(new Map(aPages.flat().map(i => [i.mal_id, { id: 'a_' + i.mal_id, realId: i.mal_id, title: i.title_english || i.title, type: 'tv', poster: i.images?.jpg?.large_image_url || '', backdrop: i.images?.jpg?.large_image_url || '', rating: i.score ? i.score.toFixed(1) : '8.0', year: i.year || '2026', overview: i.synopsis || '', lang: 'Sub/Dub', category: 'anime' }])).values());

                sliderItems = [...animeData.slice(0, 5), ...moviesData.slice(0, 5), ...kdramaData.slice(0, 5)].sort(() => Math.random() - 0.5);
                initSlider();
                renderGrid([...animeData, ...moviesData, ...kdramaData].sort(() => Math.random() - 0.5), 'contentGrid1');
            } catch (e) { console.log(e); }
        }

        let currentSlide = 0;
        function initSlider() {
            const slider = document.getElementById('heroSlider');
            if(!slider || sliderItems.length === 0) return;
            slider.innerHTML = sliderItems.map((item, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}" onclick="openPlayer('${item.realId}', '${item.type}', '${item.category}')">
                    <img src="${item.backdrop || item.poster}" alt="${item.title}">
                    <div class="slide-content">
                        <span class="slide-badge">Featured</span>
                        <div class="slide-title">${item.title}</div>
                        <div class="slide-desc">${item.overview}</div>
                        <button class="watch-btn">▶ Watch / Info</button>
                    </div>
                </div>
            `).join('');
            setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if(slides.length === 0) return;
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 4000);
        }

        function openPlayer(realId, type, category) {
            window.location.href = `player.html?id=${realId}&type=${type}&category=${category}`;
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                grid.innerHTML = '<div class="loader">No content found.</div>';
                return;
            }
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(item.realId, item.type, item.category);
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${item.title}" loading="lazy" onerror="this.src='https://placehold.co/300x450/111827/ffffff?text=Media'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info"><span>⭐ ${item.rating}</span><span>${item.year}</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchCategory(category, btn) {
            if(btn) {
                document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const t1 = document.getElementById('mainTitle1');
            const slider = document.getElementById('heroSlider');
            if (category === 'home') {
                slider.style.display = 'block';
                t1.innerText = '🔥 Trending Feed & Popular Collections';
                renderGrid([...animeData, ...moviesData, ...kdramaData].sort(() => Math.random() - 0.5), 'contentGrid1');
            } else if (category === 'movies') {
                slider.style.display = 'none';
                t1.innerText = `🎬 Trending Movies (${moviesData.length}+)`;
                renderGrid(moviesData, 'contentGrid1');
            } else if (category === 'anime') {
                slider.style.display = 'none';
                t1.innerText = `⚡ Top Anime (${animeData.length}+)`;
                renderGrid(animeData, 'contentGrid1');
            } else if (category === 'kdrama') {
                slider.style.display = 'none';
                t1.innerText = `🇰🇷 K-Dramas (${kdramaData.length}+)`;
                renderGrid(kdramaData, 'contentGrid1');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;
            const filtered = [...moviesData, ...animeData, ...kdramaData].filter(i => i.title.toLowerCase().includes(query));
            document.getElementById('heroSlider').style.display = 'none';
            document.getElementById('mainTitle1').innerText = `🔍 Search "${query}" (${filtered.length})`;
            renderGrid(filtered, 'contentGrid1');
        }

        fetchAllData();
    </script>
</body>
</html>
