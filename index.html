<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Plaza - Unlimited Movies & Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #38bdf8;
            text-decoration: none;
        }
        .search-bar input {
            padding: 8px 14px;
            width: 220px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .search-bar input:focus {
            border-color: #38bdf8;
            width: 250px;
            transition: 0.3s;
        }
        /* Category Bar */
        .categories {
            display: flex;
            gap: 12px;
            padding: 15px 5%;
            background: #0b1120;
            border-bottom: 1px solid #1e293b;
        }
        .cat-pill {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }
        .cat-pill.active, .cat-pill:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        /* Hero Slider Section */
        .hero-slider {
            position: relative;
            width: 90%;
            height: 350px;
            margin: 25px auto;
            border-radius: 14px;
            overflow: hidden;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
        }
        .slide.active {
            opacity: 1;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
        }
        .slide-content {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            z-index: 2;
        }
        .slide-badge {
            background: #38bdf8;
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .slide-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .slide-desc {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .watch-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 18px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 5% 15px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 0 5% 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .lang-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #38bdf8;
        }
        .card-content {
            padding: 10px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .card-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
        }
        .loader {
            text-align: center;
            padding: 40px;
            color: #38bdf8;
            font-size: 15px;
            font-weight: 600;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 Movie Plaza</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Movies / Anime..." onkeypress="if(event.key === 'Enter') searchContent()">
        </div>
    </header>

    <!-- Category Bar -->
    <div class="categories">
        <div class="cat-pill active" onclick="switchCategory('home', this)">🏠 Home</div>
        <div class="cat-pill" onclick="switchCategory('movies', this)">🎬 Movies Collection</div>
        <div class="cat-pill" onclick="switchCategory('anime', this)">⚡ Anime Collection</div>
    </div>

    <!-- Top Sliding Banner -->
    <div class="hero-slider" id="heroSlider">
        <div class="loader" style="padding-top: 150px;">Loading banner...</div>
    </div>

    <!-- Content Section -->
    <div class="section-header">
        <div class="section-title" id="mainTitle1">🔥 Trending & Popular Collection</div>
    </div>
    <div class="grid" id="contentGrid1">
        <div class="loader">Loading massive content, please wait...</div>
    </div>

    <script>
        let moviesData = [];
        let animeData = [];
        let sliderItems = [];

        async function fetchAllData() {
            try {
                const moviePromises = [];
                for(let p = 1; p <= 15; p++) {
                    moviePromises.push(
                        fetch(`https://api.themoviedb.org/3/movie/popular?api_key=1a878c977c07619736ef416785671db8&page=${p}`)
                            .then(res => res.json())
                            .then(d => d.results || []).catch(() => [])
                    );
                }

                const animePromises = [];
                for(let p = 1; p <= 25; p++) {
                    animePromises.push(
                        fetch(`https://api.jikan.moe/v4/top/anime?page=${p}`)
                            .then(res => res.json())
                            .then(d => d.data || []).catch(() => [])
                    );
                }

                const upcomingAnimePromise = fetch(`https://api.jikan.moe/v4/seasons/upcoming`)
                    .then(res => res.json())
                    .then(d => d.data || []).catch(() => []);

                const [mPages, aPages, upAnime] = await Promise.all([
                    Promise.all(moviePromises),
                    Promise.all(animePromises),
                    upcomingAnimePromise
                ]);

                moviesData = mPages.flat().map(i => ({
                    id: 'm_' + i.id,
                    title: i.title || i.name,
                    type: 'movie',
                    poster: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : '',
                    backdrop: i.backdrop_path ? `https://image.tmdb.org/t/p/w1280${i.backdrop_path}` : '',
                    rating: i.vote_average ? i.vote_average.toFixed(1) : '7.5',
                    year: (i.release_date || '2026').substring(0, 4),
                    overview: i.overview || 'Trending movie on Movie Plaza.',
                    lang: 'Hindi/Eng',
                    isAnime: false
                }));

                animeData = aPages.flat().map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    type: 'tv',
                    poster: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    backdrop: i.images?.jpg?.large_image_url || i.images?.jpg?.image_url || '',
                    rating: i.score ? i.score.toFixed(1) : '8.0',
                    year: i.year || '2026',
                    overview: i.synopsis || 'Top trending anime series.',
                    lang: 'Sub/Dub',
                    isAnime: true
                }));

                const upcomingFormatted = upAnime.slice(0, 5).map(i => ({
                    id: 'a_' + i.mal_id,
                    title: i.title_english || i.title,
                    poster: i.images?.jpg?.large_image_url || '',
                    badge: '🔥 Upcoming Anime',
                    overview: i.synopsis || 'Coming soon to Movie Plaza.',
                    isAnime: true,
                    realId: i.mal_id,
                    type: 'tv'
                }));

                const topTrending = animeData.slice(0, 5).map(i => ({
                    id: i.id,
                    title: i.title,
                    poster: i.backdrop,
                    badge: '⚡ Top Trending Anime',
                    overview: i.overview,
                    isAnime: true,
                    realId: i.id.replace('a_', ''),
                    type: 'tv'
                }));

                const topMovies = moviesData.slice(0, 5).map(i => ({
                    id: i.id,
                    title: i.title,
                    poster: i.backdrop,
                    badge: '🎬 Popular Movie',
                    overview: i.overview,
                    isAnime: false,
                    realId: i.id.replace('m_', ''),
                    type: i.type
                }));

                sliderItems = [...upcomingFormatted, ...topTrending, ...topMovies];
                initSlider();

                const mixedHome = [...animeData.slice(0, 30), ...moviesData.slice(0, 30)];
                renderGrid(mixedHome, 'contentGrid1');

            } catch (e) {
                console.log("Error fetching data", e);
            }
        }

        let currentSlide = 0;
        function initSlider() {
            const slider = document.getElementById('heroSlider');
            if(!slider || sliderItems.length === 0) return;

            slider.innerHTML = sliderItems.map((item, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}" onclick="openPlayer('${item.realId}', '${item.type}', ${item.isAnime})">
                    <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://placehold.co/1280x720/1e293b/ffffff?text=Movie+Plaza'">
                    <div class="slide-content">
                        <span class="slide-badge">${item.badge}</span>
                        <div class="slide-title">${item.title}</div>
                        <div class="slide-desc">${item.overview}</div>
                        <button class="watch-btn">▶ Watch Now</button>
                    </div>
                </div>
            `).join('');

            setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if(slides.length === 0) return;
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 4000);
        }

        function openPlayer(realId, type, isAnime) {
            if(isAnime) {
                window.location.href = `player.html?id=${realId}&type=tv&isAnime=true`;
            } else {
                window.location.href = `player.html?id=${realId}&type=${type}&isAnime=false`;
            }
        }

        function renderGrid(list, targetId) {
            const grid = document.getElementById(targetId);
            if (!grid) return;
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.innerHTML = '<div class="loader">No content found.</div>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const realId = item.id.replace(/^[ma]_/, '');
                
                card.onclick = () => openPlayer(realId, item.type, item.isAnime);
                
                const safeTitle = item.title ? item.title.replace(/'/g, "") : "Media";
                card.innerHTML = `
                    <span class="lang-badge">${item.lang}</span>
                    <img src="${item.poster}" alt="${safeTitle}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/500x750/1e293b/ffffff?text=${encodeURIComponent(safeTitle)}'">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-info">
                            <span>⭐ ${item.rating}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchCategory(category, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const t1 = document.getElementById('mainTitle1');
            const slider = document.getElementById('heroSlider');

            if (category === 'home') {
                slider.style.display = 'block';
                t1.innerText = '🔥 Trending & Popular Collection';
                const mixedHome = [...animeData.slice(0, 30), ...moviesData.slice(0, 30)];
                renderGrid(mixedHome, 'contentGrid1');
            } else if (category === 'movies') {
                slider.style.display = 'none';
                t1.innerText = '🎬 All Movies Collection (600+ Movies)';
                renderGrid(moviesData, 'contentGrid1');
            } else if (category === 'anime') {
                slider.style.display = 'none';
                t1.innerText = '⚡ All Anime Collection (1000+ Anime)';
                renderGrid(animeData, 'contentGrid1');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            const allCombined = [...moviesData, ...animeData];
            const filtered = allCombined.filter(i => i.title.toLowerCase().includes(query));

            document.getElementById('heroSlider').style.display = 'none';
            document.getElementById('mainTitle1').innerText = `🔍 Search Results for "${query}"`;
            renderGrid(filtered, 'contentGrid1');
        }

        fetchAllData();
    </script>
</body>
</html>
