<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Plaza - Premium Streaming</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        .filters { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        button { background: #1e293b; color: #fff; border: 1px solid #38bdf8; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        button:hover, button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card-title { font-size: 1.1rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info { font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; }
        .badge { background: #38bdf8; color: #0f172a; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; }
        .loader { text-align: center; font-size: 1.5rem; color: #38bdf8; margin-top: 50px; }

        /* Modal Player & Controls */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { position: relative; width: 95%; max-width: 900px; background: #1e293b; border-radius: 12px; overflow: hidden; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 30px; font-weight: bold; cursor: pointer; z-index: 1001; }
        
        /* Episode & Season Selector UI */
        .controls-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 12px; background: #0f172a; }
        .controls-bar select { background: #1e293b; color: #fff; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Cinema Plaza</h1>
        <p>Automated Movies & Anime Hub</p>
    </header>

    <div class="filters">
        <button class="active" onclick="filterContent('all')">All</button>
        <button onclick="filterContent('movie')">Movies</button>
        <button onclick="filterContent('anime')">Anime</button>
    </div>

    <div id="loader" class="loader">Loading content...</div>
    <div id="content-grid" class="grid"></div>

    <!-- Video Modal Player -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            
            <div class="controls-bar" id="controlsBar">
                <!-- Server Selector -->
                <select id="serverSelect" onchange="updateStreamUrl()">
                    <option value="vidlink">Server 1 (VidLink - Multi Auto-Audio & Sub)</option>
                    <option value="autoembed">Server 2 (AutoEmbed)</option>
                </select>

                <!-- Season Selector (Only for Anime/TV) -->
                <select id="seasonSelect" onchange="onSeasonChange()" style="display: none;">
                    <!-- Auto populated -->
                </select>

                <!-- Episode Selector (Only for Anime/TV) -->
                <select id="episodeSelect" onchange="updateStreamUrl()" style="display: none;">
                    <!-- Auto populated -->
                </select>
            </div>

            <div class="iframe-container">
                <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        window.open = function() { return null; }; // Block Popups

        const API_URL = 'https://cinema-plaza.onrender.com/api/content';
        let allData = [];
        let currentItem = null;

        async function loadContent() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if(data.success) {
                    allData = data.data;
                    document.getElementById('loader').style.display = 'none';
                    renderCards(allData);
                }
            } catch (error) {
                document.getElementById('loader').innerText = 'Failed to load content. Please refresh.';
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(item);
                card.innerHTML = `
                    <img src="${item.poster || 'https://via.placeholder.com/500x750?text=No+Poster'}" alt="${item.title}">
                    <div class="card-content">
                        <div class="card-title" title="${item.title}">${item.title}</div>
                        <div class="card-info">
                            <span class="badge">${item.type}</span>
                            <span>⭐ ${item.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterContent(type) {
            document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if(type === 'all') renderCards(allData);
            else renderCards(allData.filter(i => i.type === type));
        }

        function openPlayer(item) {
            currentItem = item;
            const playerModal = document.getElementById('videoModal');
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');

            if(item.type === 'anime') {
                seasonSelect.style.display = 'inline-block';
                episodeSelect.style.display = 'inline-block';
                
                // Populating Seasons (Default 1 to 5)
                seasonSelect.innerHTML = '';
                for(let s = 1; s <= 5; s++) {
                    seasonSelect.innerHTML += `<option value="${s}">Season ${s}</option>`;
                }

                populateEpisodes(1);
            } else {
                seasonSelect.style.display = 'none';
                episodeSelect.style.display = 'none';
            }

            updateStreamUrl();
            playerModal.style.display = 'flex';
        }

        function populateEpisodes(seasonNum) {
            const episodeSelect = document.getElementById('episodeSelect');
            episodeSelect.innerHTML = '';
            // Populating Episodes (Default 1 to 24 per season)
            for(let e = 1; e <= 24; e++) {
                episodeSelect.innerHTML += `<option value="${e}">Episode ${e}</option>`;
            }
        }

        function onSeasonChange() {
            const seasonNum = document.getElementById('seasonSelect').value;
            populateEpisodes(seasonNum);
            updateStreamUrl();
        }

        function updateStreamUrl() {
            const iframe = document.getElementById('videoPlayer');
            const server = document.getElementById('serverSelect').value;
            const id = currentItem.id;

            if(currentItem.type === 'movie') {
                if(server === 'vidlink') {
                    iframe.src = `https://vidlink.pro/movie/${id}`;
                } else {
                    iframe.src = `https://player.autoembed.cc/embed/movie/${id}`;
                }
            } else {
                // Anime / Series Logic
                const season = document.getElementById('seasonSelect').value || 1;
                const episode = document.getElementById('episodeSelect').value || 1;

                if(server === 'vidlink') {
                    iframe.src = `https://vidlink.pro/tv/${id}/${season}/${episode}`;
                } else {
                    iframe.src = `https://player.autoembed.cc/embed/tv/${id}/${season}/${episode}`;
                }
            }
        }

        function closePlayer() {
            const playerModal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = ''; 
            playerModal.style.display = 'none';
        }

        loadContent();
    </script>
</body>
</html>
